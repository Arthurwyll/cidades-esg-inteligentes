services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-esg}
      POSTGRES_USER: ${POSTGRES_USER:-esg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - esg-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    image: ${APP_IMAGE:-cidades-esg:local}
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-esg}
      DB_USER: ${POSTGRES_USER:-esg}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_ENV: ${APP_ENV:-local}
      LOGGING_FILE_PATH: /app/logs
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - esg-net
    restart: unless-stopped

volumes:
  pgdata:
  app-logs:

networks:
  esg-net:
    driver: bridge
