name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build + testes automatizados
        run: mvn -B verify

      - name: Publicar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: target/surefire-reports

  docker:
    name: Imagem Docker
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir nome da imagem (minusculo)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (e push em main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy staging
    if: github.event_name == 'push'
    needs: docker
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      app_port: "8081"
      image: ${{ needs.docker.outputs.image }}:${{ github.sha }}
    secrets: inherit

  deploy-production:
    name: Deploy producao
    if: github.event_name == 'push'
    needs: [docker, deploy-staging]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      app_port: "8080"
      image: ${{ needs.docker.outputs.image }}:${{ github.sha }}
    secrets: inherit
