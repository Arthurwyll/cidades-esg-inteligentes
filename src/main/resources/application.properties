spring.application.name=cidades-esg
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/esg}
spring.datasource.username=${DB_USER:esg}
spring.datasource.password=${DB_PASSWORD:esg}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.environment=${APP_ENV:local}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
